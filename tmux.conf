set -g mouse on

# allow left click into system clipboard
set -g set-clipboard on

# Swap between full-screen ewith Ctrl+B O
bind-key O run-shell 'tmux resize-pane -Z; tmux select-pane -t :.+; tmux resize-pane -Z'

# Add system clipboard integration
setw -g mode-keys vi
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"

# Style
set -g status-right '%Y-%m-%d %H:%M:%S'
set -g status-bg color236
set -g status-fg color109
set -g message-style bg=color61
set -g pane-border-style fg=color238
set -g pane-active-border-style fg=color109
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Unbind split-horizontal
unbind h
unbind %
bind -r | split-window -h
bind -r _ split-window -v

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r l select-pane -R
bind -r h select-pane -L

# vim like pane resizing Hold ctrl + b <h,j,l,h>
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-l resize-pane -R
bind -r C-h resize-pane -L

# quickly refresh
bind -r r source-file "~/.tmux.conf"
